# ======================================================
# Smart Garage Management System - Application Properties
# ======================================================

# Server
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# Application Name
spring.application.name=Smart Garage Management System
garage.name=${GARAGE_NAME:NEKA Garage}

# Firebase Configuration
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase-service-account.json}
firebase.project-id=${FIREBASE_PROJECT_ID:your-firebase-project-id}
firebase.web.api-key=${FIREBASE_WEB_API_KEY:your-firebase-web-api-key}
firebase.web.auth-domain=${FIREBASE_AUTH_DOMAIN:your-project.firebaseapp.com}
firebase.web.storage-bucket=${FIREBASE_STORAGE_BUCKET:your-project.appspot.com}
firebase.web.messaging-sender-id=${FIREBASE_MESSAGING_SENDER_ID:your-sender-id}
firebase.web.app-id=${FIREBASE_APP_ID:your-app-id}

# Billing Settings
billing.tax.percentage=${BILLING_TAX_PERCENTAGE:18.0}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true

# Logging
logging.level.com.garage.management=INFO
logging.level.com.google.cloud.firestore=WARN
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.default-property-inclusion=non_null

# SSE
spring.mvc.async.request-timeout=300000

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
