<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Billing — NEKA Garage</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo"><div class="sidebar-logo-icon">NG</div><div><div class="sidebar-logo-text">NEKA Garage</div><div class="sidebar-logo-sub">Staff Portal</div></div></div>
  <nav class="sidebar-nav">
    <a href="/staff-dashboard.html" class="nav-item"><span class="nav-icon">🏠</span> Dashboard</a>
    <a href="/staff-bookings.html" class="nav-item"><span class="nav-icon">📅</span> Bookings</a>
    <a href="/staff-service-board.html" class="nav-item"><span class="nav-icon">⚙️</span> Service Board</a>
    <a href="/staff-bays.html" class="nav-item"><span class="nav-icon">🏢</span> Bays</a>
    <a href="/staff-mechanics.html" class="nav-item"><span class="nav-icon">👨‍🔧</span> Mechanics</a>
    <a href="/staff-customers.html" class="nav-item"><span class="nav-icon">👥</span> Customers</a>
    <a href="/staff-billing.html" class="nav-item active"><span class="nav-icon">🧾</span> Billing</a>
  </nav>
  <div class="sidebar-footer">
    <div class="user-chip">
      <div class="user-avatar" id="sidebar-user-avatar">?</div>
      <div><div class="user-info-name" id="sidebar-user-name">Loading…</div><div class="user-info-role" id="sidebar-user-role">Staff</div></div>
      <button id="btn-logout" style="margin-left:auto;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1.1rem">⏻</button>
    </div>
  </div>
</aside>

<div class="main-content">
  <header class="topbar">
    <div><div class="topbar-title">🧾 Billing</div><div class="topbar-subtitle">Generate and manage bills</div></div>
  </header>
  <div class="page-content">

    <!-- Generate Bill -->
    <div class="content-card mb-4">
      <div class="content-card-header"><span class="section-title">Generate New Bill</span></div>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Service Job ID</label>
          <input type="text" id="bill-job-id" class="form-control-glass" placeholder="Enter service job ID"/>
        </div>
        <div class="col-md-3">
          <label class="form-label">Labour Cost (₹)</label>
          <input type="number" id="bill-labour" class="form-control-glass" placeholder="0.00" min="0" step="0.01"/>
        </div>
        <div class="col-md-3">
          <label class="form-label">Discount (₹)</label>
          <input type="number" id="bill-discount" class="form-control-glass" placeholder="0.00" min="0" step="0.01"/>
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button onclick="generateBill()" class="btn-amber w-100">Generate</button>
        </div>
      </div>
      <div id="bill-preview" style="margin-top:1rem;display:none"></div>
    </div>

    <!-- All Bills -->
    <div class="content-card">
      <div class="content-card-header">
        <span class="section-title">All Bills</span>
        <div style="display:flex;gap:0.5rem">
          <span id="revenue-badge" style="background:var(--success-bg);color:var(--success);padding:0.25rem 0.75rem;border-radius:100px;font-size:0.8rem;font-weight:600"></span>
          <button onclick="loadBills()" class="btn-glass" style="font-size:0.8rem;padding:0.3rem 0.75rem">↻</button>
        </div>
      </div>
      <div id="bills-table-container">
        <div class="empty-state"><div class="empty-state-icon">🧾</div><div class="empty-state-title">No bills yet</div></div>
      </div>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="/js/firebase-init.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script>
GarageAuth.requireAuth(['STAFF','ADMIN']);

garageAuth.onAuthStateChanged(async user => {
  if (!user) return;
  setupSidebarUser(); setupLogoutBtn();
  await loadBills();
});

async function loadBills() {
  Loader.show();
  try {
    const bills = await API.getBills();
    const totalRevenue = bills.filter(b => b.paymentStatus === 'PAID').reduce((s, b) => s + (b.totalAmount||0), 0);
    document.getElementById('revenue-badge').textContent = `Revenue: ${formatCurrency(totalRevenue)}`;

    if (bills.length === 0) return;
    bills.sort((a,b) => new Date(b.generatedAt||0) - new Date(a.generatedAt||0));

    document.getElementById('bills-table-container').innerHTML = `
      <table class="table-glass w-100">
        <thead><tr><th>Bill ID</th><th>Job ID</th><th>Labour</th><th>Parts</th><th>Tax</th><th>Discount</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
          ${bills.map(b => `<tr>
            <td style="font-size:0.75rem;font-weight:700;color:var(--amber-400)">${b.billId?.slice(-8)?.toUpperCase()}</td>
            <td style="font-size:0.75rem;color:var(--text-muted)">${b.serviceJobId?.slice(-8)?.toUpperCase()}</td>
            <td>${formatCurrency(b.labourCost)}</td>
            <td>${formatCurrency(b.partsCost)}</td>
            <td style="color:var(--text-muted)">${formatCurrency(b.taxAmount)} (${b.taxPercentage}%)</td>
            <td style="color:var(--danger)">${b.discount>0?'-'+formatCurrency(b.discount):'—'}</td>
            <td style="font-weight:700;color:var(--text-primary)">${formatCurrency(b.totalAmount)}</td>
            <td>${getStatusBadge(b.paymentStatus)}</td>
            <td>${b.paymentStatus==='PENDING'?`<button onclick="markPaid('${b.billId}')" class="btn-amber" style="font-size:0.75rem;padding:0.3rem 0.65rem">✓ Mark Paid</button>`:''}</td>
          </tr>`).join('')}
        </tbody>
      </table>`;
  } catch (err) { Toast.error(err.message); }
  finally { Loader.hide(); }
}

async function generateBill() {
  const jobId = document.getElementById('bill-job-id').value.trim();
  if (!jobId) { Toast.warning('Enter a service job ID.'); return; }
  const labourCost = parseFloat(document.getElementById('bill-labour').value)||0;
  const discount = parseFloat(document.getElementById('bill-discount').value)||0;
  Loader.show();
  try {
    const bill = await API.generateBill({ serviceJobId: jobId, labourCost, discount });
    document.getElementById('bill-preview').style.display = 'block';
    document.getElementById('bill-preview').innerHTML = `
      <div style="background:var(--success-bg);border:1px solid rgba(34,197,94,0.2);border-radius:var(--radius-sm);padding:1rem">
        <div style="font-weight:700;color:var(--success);margin-bottom:0.5rem">✅ Bill Generated Successfully</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0.5rem;font-size:0.85rem">
          <div><div style="color:var(--text-muted);font-size:0.75rem">Bill ID</div><div style="font-weight:600;color:var(--amber-400)">${bill.billId?.slice(-8)?.toUpperCase()}</div></div>
          <div><div style="color:var(--text-muted);font-size:0.75rem">Labour</div><div>${formatCurrency(bill.labourCost)}</div></div>
          <div><div style="color:var(--text-muted);font-size:0.75rem">Parts</div><div>${formatCurrency(bill.partsCost)}</div></div>
          <div><div style="color:var(--text-muted);font-size:0.75rem">Tax (${bill.taxPercentage}%)</div><div>${formatCurrency(bill.taxAmount)}</div></div>
          <div><div style="color:var(--text-muted);font-size:0.75rem">Total</div><div style="font-size:1.1rem;font-weight:800;color:var(--text-primary)">${formatCurrency(bill.totalAmount)}</div></div>
        </div>
      </div>`;
    await loadBills();
    Toast.success(`Bill generated! Total: ${formatCurrency(bill.totalAmount)}`);
  } catch (err) { Toast.error(err.message); }
  finally { Loader.hide(); }
}

async function markPaid(billId) {
  if (!confirm('Mark this bill as PAID?')) return;
  Loader.show();
  try { await API.markBillPaid(billId); Toast.success('Bill marked as paid!'); await loadBills(); }
  catch (err) { Toast.error(err.message); }
  finally { Loader.hide(); }
}
</script>
</body>
</html>
