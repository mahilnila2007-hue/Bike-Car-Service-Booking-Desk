<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="View customer list at NEKA Garage — search customers, view their vehicles and bookings."/>
  <title>Customers — NEKA Garage</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo"><div class="sidebar-logo-icon">NG</div><div><div class="sidebar-logo-text">NEKA Garage</div><div class="sidebar-logo-sub">Staff Portal</div></div></div>
  <nav class="sidebar-nav">
    <a href="/staff-dashboard.html" class="nav-item"><span class="nav-icon">🏠</span> Dashboard</a>
    <a href="/staff-bookings.html" class="nav-item"><span class="nav-icon">📅</span> Bookings</a>
    <a href="/staff-service-board.html" class="nav-item"><span class="nav-icon">⚙️</span> Service Board</a>
    <a href="/staff-bays.html" class="nav-item"><span class="nav-icon">🏢</span> Bays</a>
    <a href="/staff-mechanics.html" class="nav-item"><span class="nav-icon">👨‍🔧</span> Mechanics</a>
    <a href="/staff-customers.html" class="nav-item active"><span class="nav-icon">👥</span> Customers</a>
    <a href="/staff-billing.html" class="nav-item"><span class="nav-icon">🧾</span> Billing</a>
  </nav>
  <div class="sidebar-footer">
    <div class="user-chip">
      <div class="user-avatar" id="sidebar-user-avatar">?</div>
      <div><div class="user-info-name" id="sidebar-user-name">Loading…</div><div class="user-info-role" id="sidebar-user-role">Staff</div></div>
      <button id="btn-logout" style="margin-left:auto;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1.1rem">⏻</button>
    </div>
  </div>
</aside>

<div class="main-content">
  <header class="topbar">
    <div><div class="topbar-title">👥 Customers</div><div class="topbar-subtitle">Browse and search all registered customers</div></div>
    <button onclick="loadData()" class="btn-glass" style="font-size:0.8rem">↻ Refresh</button>
  </header>
  <div class="page-content">

    <!-- Search & Stats -->
    <div class="row g-3 mb-4">
      <div class="col-md-8">
        <div class="content-card" style="padding:1rem">
          <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="search" class="form-control-glass" placeholder="Search by name, email, or phone…" oninput="renderCustomers()"/>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card">
          <div class="stat-icon" style="background:var(--info-bg);color:var(--info)">👥</div>
          <div class="stat-value" id="stat-customers">—</div>
          <div class="stat-label">Total Customers</div>
        </div>
      </div>
    </div>

    <!-- Customer List & Detail -->
    <div class="row g-3">
      <!-- Left: Customer List -->
      <div class="col-md-5">
        <div class="content-card" style="height:calc(100vh - 200px);overflow-y:auto">
          <div id="customer-list">
            <div class="empty-state"><div class="empty-state-icon">👥</div><div class="empty-state-title">Loading customers…</div></div>
          </div>
        </div>
      </div>

      <!-- Right: Customer Detail -->
      <div class="col-md-7">
        <div id="customer-detail">
          <div class="empty-state"><div class="empty-state-icon">👤</div><div class="empty-state-title">Select a customer to view details</div></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/firebase-init.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script>
GarageAuth.requireAuth(['STAFF', 'ADMIN']);

let allCustomers = [], allVehicles = [], allBookings = [];
let selectedCustomerId = null;

garageAuth.onAuthStateChanged(async user => {
  if (!user) return;
  setupSidebarUser(); setupLogoutBtn();
  await loadData();
});

async function loadData() {
  Loader.show();
  try {
    const [users, vehicles, bookings] = await Promise.all([
      API.getAllUsers().catch(() => []),
      API.getVehicles(),
      API.getBookings()
    ]);
    allCustomers = users.filter(u => u.role === 'CUSTOMER');
    allVehicles = vehicles;
    allBookings = bookings;
    document.getElementById('stat-customers').textContent = allCustomers.length;
    renderCustomers();
  } catch (err) { Toast.error(err.message); }
  finally { Loader.hide(); }
}

function renderCustomers() {
  const search = document.getElementById('search').value.toLowerCase();
  const filtered = allCustomers.filter(c =>
    !search || [c.name, c.email, c.phone].join(' ').toLowerCase().includes(search)
  );

  if (filtered.length === 0) {
    document.getElementById('customer-list').innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><div class="empty-state-title">No customers found</div></div>';
    return;
  }

  document.getElementById('customer-list').innerHTML = filtered.map(c => {
    const vehicleCount = allVehicles.filter(v => v.customerId === c.uid).length;
    const bookingCount = allBookings.filter(b => b.customerId === c.uid).length;
    const isSelected = c.uid === selectedCustomerId;
    return `
      <div onclick="selectCustomer('${c.uid}')"
        style="cursor:pointer;padding:0.85rem;border-radius:var(--radius-sm);border:1px solid ${isSelected ? 'var(--amber-500)' : 'var(--border-color)'};background:${isSelected ? 'var(--amber-glow)' : 'var(--bg-card)'};margin-bottom:0.5rem;transition:var(--transition)">
        <div style="display:flex;align-items:center;gap:0.75rem">
          <div style="width:40px;height:40px;border-radius:50%;background:var(--amber-glow);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--amber-400);font-size:1rem;flex-shrink:0">
            ${(c.name || c.email || '?')[0].toUpperCase()}
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.name || '—'}</div>
            <div style="font-size:0.75rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.email || ''}</div>
          </div>
          <div style="text-align:right;font-size:0.75rem;color:var(--text-muted)">
            <div>🚗 ${vehicleCount}</div>
            <div>📅 ${bookingCount}</div>
          </div>
        </div>
      </div>`;
  }).join('');
}

function selectCustomer(uid) {
  selectedCustomerId = uid;
  renderCustomers();
  renderCustomerDetail(uid);
}

function renderCustomerDetail(uid) {
  const c = allCustomers.find(c => c.uid === uid);
  if (!c) return;
  const vehicles = allVehicles.filter(v => v.customerId === uid);
  const bookings = allBookings.filter(b => b.customerId === uid);
  bookings.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

  document.getElementById('customer-detail').innerHTML = `
    <div class="content-card">
      <div class="content-card-header">
        <div style="display:flex;align-items:center;gap:0.75rem">
          <div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--amber-500),var(--amber-600));display:flex;align-items:center;justify-content:center;font-weight:800;color:white;font-size:1.2rem">
            ${(c.name || c.email || '?')[0].toUpperCase()}
          </div>
          <div>
            <div style="font-weight:800;font-size:1.1rem;color:var(--text-primary)">${c.name || '—'}</div>
            <div style="font-size:0.8rem;color:var(--text-muted)">${c.email || ''}</div>
          </div>
        </div>
      </div>

      <div class="row g-2 mb-4" style="margin-top:0.5rem">
        <div class="col-6"><div style="font-size:0.7rem;color:var(--text-muted);text-transform:uppercase">Phone</div><div style="font-weight:600">${c.phone || '—'}</div></div>
        <div class="col-6"><div style="font-size:0.7rem;color:var(--text-muted);text-transform:uppercase">Role</div><div style="font-weight:600">${c.role || 'CUSTOMER'}</div></div>
        <div class="col-6"><div style="font-size:0.7rem;color:var(--text-muted);text-transform:uppercase">Vehicles</div><div style="font-weight:600">${vehicles.length}</div></div>
        <div class="col-6"><div style="font-size:0.7rem;color:var(--text-muted);text-transform:uppercase">Total Bookings</div><div style="font-weight:600">${bookings.length}</div></div>
      </div>

      <!-- Vehicles -->
      <div class="section-title" style="margin-bottom:0.75rem;font-size:0.85rem">🚗 Registered Vehicles</div>
      ${vehicles.length === 0 ? '<p style="color:var(--text-muted);font-size:0.85rem">No vehicles registered.</p>' :
        vehicles.map(v => `
          <div style="background:rgba(255,255,255,0.03);border:1px solid var(--border-color);border-radius:var(--radius-sm);padding:0.75rem;margin-bottom:0.5rem">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div>
                <div style="font-weight:600;color:var(--text-primary)">${v.brand || ''} ${v.model || ''} <span style="color:var(--amber-400)">${v.year || ''}</span></div>
                <div style="font-size:0.78rem;color:var(--text-muted)">${v.registrationNumber || '—'} · ${v.vehicleType || '—'}</div>
              </div>
              <div style="font-size:0.75rem;color:var(--text-muted);text-align:right">
                <div>${v.color || ''}</div>
                <div>${v.fuelType || ''}</div>
              </div>
            </div>
          </div>`).join('')}

      <!-- Recent Bookings -->
      <div class="section-title" style="margin:1rem 0 0.75rem;font-size:0.85rem">📅 Recent Bookings</div>
      ${bookings.length === 0 ? '<p style="color:var(--text-muted);font-size:0.85rem">No bookings yet.</p>' :
        bookings.slice(0, 5).map(b => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0;border-bottom:1px solid var(--border-color)">
            <div>
              <div style="font-size:0.85rem;font-weight:500;color:var(--text-primary)">${b.serviceType || '—'}</div>
              <div style="font-size:0.75rem;color:var(--text-muted)">${b.bookingDate || ''} · ${b.preferredTime || ''}</div>
            </div>
            ${getStatusBadge(b.status)}
          </div>`).join('')}
      ${bookings.length > 5 ? `<div style="font-size:0.8rem;color:var(--text-muted);margin-top:0.5rem">${bookings.length - 5} more bookings…</div>` : ''}
    </div>`;
}
</script>
</body>
</html>
