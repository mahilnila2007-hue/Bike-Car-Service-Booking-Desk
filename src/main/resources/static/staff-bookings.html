<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Staff Bookings — NEKA Garage</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo"><div class="sidebar-logo-icon">NG</div><div><div class="sidebar-logo-text">NEKA Garage</div><div class="sidebar-logo-sub">Staff Portal</div></div></div>
  <nav class="sidebar-nav">
    <a href="/staff-dashboard.html" class="nav-item"><span class="nav-icon">🏠</span> Dashboard</a>
    <a href="/staff-bookings.html" class="nav-item active"><span class="nav-icon">📅</span> Bookings</a>
    <a href="/staff-service-board.html" class="nav-item"><span class="nav-icon">⚙️</span> Service Board</a>
    <a href="/staff-bays.html" class="nav-item"><span class="nav-icon">🏢</span> Bays</a>
    <a href="/staff-mechanics.html" class="nav-item"><span class="nav-icon">👨‍🔧</span> Mechanics</a>
    <a href="/staff-customers.html" class="nav-item"><span class="nav-icon">👥</span> Customers</a>
    <a href="/staff-billing.html" class="nav-item"><span class="nav-icon">🧾</span> Billing</a>
  </nav>
  <div class="sidebar-footer">
    <div class="user-chip">
      <div class="user-avatar" id="sidebar-user-avatar">?</div>
      <div><div class="user-info-name" id="sidebar-user-name">Loading…</div><div class="user-info-role" id="sidebar-user-role">Staff</div></div>
      <button id="btn-logout" style="margin-left:auto;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1.1rem">⏻</button>
    </div>
  </div>
</aside>

<div class="main-content">
  <header class="topbar">
    <div><div class="topbar-title">📅 All Bookings</div><div class="topbar-subtitle">Manage and process customer bookings</div></div>
    <button onclick="loadBookings()" class="btn-glass" style="font-size:0.8rem">↻ Refresh</button>
  </header>
  <div class="page-content">

    <!-- Filters -->
    <div class="content-card mb-3">
      <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap">
        <div class="search-wrapper" style="flex:1;min-width:200px">
          <span class="search-icon">🔍</span>
          <input type="text" id="search" class="form-control-glass" placeholder="Search booking, vehicle, customer…" oninput="renderTable()"/>
        </div>
        <select id="status-filter" class="form-select-glass" style="max-width:200px" onchange="renderTable()">
          <option value="">All Statuses</option>
          <option value="PENDING">Pending</option>
          <option value="CONFIRMED">Confirmed</option>
          <option value="VEHICLE_RECEIVED">Vehicle Received</option>
          <option value="COMPLETED">Completed</option>
          <option value="CANCELLED">Cancelled</option>
        </select>
      </div>
    </div>

    <div class="content-card">
      <div id="bookings-table-container">
        <div class="empty-state"><div class="empty-state-icon">📅</div><div class="empty-state-title">Loading bookings…</div></div>
      </div>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="/js/firebase-init.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script>
GarageAuth.requireAuth(['STAFF','ADMIN']);
let allBookings = [], vehicleMap = {}, customerMap = {};

garageAuth.onAuthStateChanged(async user => {
  if (!user) return;
  setupSidebarUser(); setupLogoutBtn();
  await loadBookings();
});

async function loadBookings() {
  Loader.show();
  try {
    const [bookings, vehicles, users] = await Promise.all([
      API.getBookings(), API.getVehicles(), API.getAllUsers().catch(() => [])
    ]);
    allBookings = bookings;
    vehicles.forEach(v => vehicleMap[v.vehicleId] = v);
    users.forEach(u => customerMap[u.uid] = u);
    renderTable();
  } catch (err) { Toast.error(err.message); }
  finally { Loader.hide(); }
}

function renderTable() {
  const search = document.getElementById('search').value.toLowerCase();
  const status = document.getElementById('status-filter').value;
  let filtered = allBookings.filter(b => {
    const v = vehicleMap[b.vehicleId]||{};
    const c = customerMap[b.customerId]||{};
    const matches = !search || [b.bookingId, v.registrationNumber, v.brand, v.model, c.name, b.serviceType].join(' ').toLowerCase().includes(search);
    const statusMatch = !status || b.status === status;
    return matches && statusMatch;
  });
  filtered.sort((a,b) => new Date(b.createdAt||0) - new Date(a.createdAt||0));

  if (filtered.length === 0) {
    document.getElementById('bookings-table-container').innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><div class="empty-state-title">No bookings found</div></div>';
    return;
  }

  document.getElementById('bookings-table-container').innerHTML = `
    <table class="table-glass w-100">
      <thead><tr><th>ID</th><th>Customer</th><th>Vehicle</th><th>Service</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>
        ${filtered.map(b => {
          const v = vehicleMap[b.vehicleId]||{};
          const c = customerMap[b.customerId]||{};
          return `<tr>
            <td style="font-size:0.75rem;font-weight:700;color:var(--amber-400)">${b.bookingId?.slice(-8)?.toUpperCase()}</td>
            <td><div style="font-weight:500;color:var(--text-primary)">${c.name||'Unknown'}</div><div style="font-size:0.75rem;color:var(--text-muted)">${c.phone||''}</div></td>
            <td><div style="font-weight:500">${v.brand||''} ${v.model||''}</div><div style="font-size:0.75rem;color:var(--amber-400)">${v.registrationNumber||''}</div></td>
            <td style="font-size:0.85rem">${b.serviceType||'—'}</td>
            <td style="font-size:0.85rem">${b.bookingDate||'—'}</td>
            <td>${getStatusBadge(b.status)}</td>
            <td>
              <div style="display:flex;gap:0.4rem;flex-wrap:wrap">
                ${b.status==='PENDING'?`<button onclick="confirmBooking('${b.bookingId}')" class="btn-amber" style="font-size:0.75rem;padding:0.3rem 0.65rem">✓ Confirm</button>`:''}
                ${b.status==='CONFIRMED'?`<button onclick="receiveVehicle('${b.bookingId}')" class="btn-amber" style="font-size:0.75rem;padding:0.3rem 0.65rem">Receive</button>`:''}
                ${b.status==='VEHICLE_RECEIVED'?`<button onclick="createJob('${b.bookingId}')" class="btn-glass" style="font-size:0.75rem;padding:0.3rem 0.65rem">Create Job</button>`:''}
                ${['PENDING','CONFIRMED'].includes(b.status)?`<button onclick="cancelBooking('${b.bookingId}')" style="font-size:0.75rem;padding:0.3rem 0.65rem;background:none;border:1px solid rgba(239,68,68,0.3);color:var(--danger);border-radius:var(--radius-sm);cursor:pointer">Cancel</button>`:''}
              </div>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

async function confirmBooking(id) {
  Loader.show();
  try { await API.confirmBooking(id); Toast.success('Booking confirmed!'); await loadBookings(); }
  catch (err) { Toast.error(err.message); }
  finally { Loader.hide(); }
}

async function receiveVehicle(id) {
  Loader.show();
  try { await API.receiveVehicle(id); Toast.success('Vehicle received!'); await loadBookings(); }
  catch (err) { Toast.error(err.message); }
  finally { Loader.hide(); }
}

async function createJob(bookingId) {
  Loader.show();
  try {
    const job = await API.createServiceJob(bookingId);
    Toast.success('Service job created!');
    window.location.href = `/staff-service-board.html?jobId=${job.serviceJobId}`;
  } catch (err) { Toast.error(err.message); }
  finally { Loader.hide(); }
}

async function cancelBooking(id) {
  if (!confirm('Cancel this booking?')) return;
  Loader.show();
  try { await API.cancelBooking(id); Toast.success('Booking cancelled.'); await loadBookings(); }
  catch (err) { Toast.error(err.message); }
  finally { Loader.hide(); }
}
</script>
</body>
</html>
