<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Vehicles — NEKA Garage</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo"><div class="sidebar-logo-icon">NG</div><div><div class="sidebar-logo-text">NEKA Garage</div><div class="sidebar-logo-sub">Customer Portal</div></div></div>
  <nav class="sidebar-nav">
    <a href="/customer-dashboard.html" class="nav-item"><span class="nav-icon">🏠</span> Dashboard</a>
    <a href="/customer-vehicles.html" class="nav-item active"><span class="nav-icon">🚗</span> My Vehicles</a>
    <a href="/customer-book-service.html" class="nav-item"><span class="nav-icon">📅</span> Book Service</a>
    <a href="/customer-service-tracking.html" class="nav-item"><span class="nav-icon">📍</span> Live Tracking</a>
    <a href="/customer-history.html" class="nav-item"><span class="nav-icon">📋</span> Service History</a>
    <a href="/customer-bills.html" class="nav-item"><span class="nav-icon">🧾</span> Bills</a>
  </nav>
  <div class="sidebar-footer">
    <div class="user-chip">
      <div class="user-avatar" id="sidebar-user-avatar">?</div>
      <div><div class="user-info-name" id="sidebar-user-name">Loading…</div><div class="user-info-role" id="sidebar-user-role">Customer</div></div>
      <button id="btn-logout" style="margin-left:auto;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1.1rem">⏻</button>
    </div>
  </div>
</aside>

<div class="main-content">
  <header class="topbar">
    <div><div class="topbar-title">🚗 My Vehicles</div><div class="topbar-subtitle">Manage your registered vehicles</div></div>
    <button onclick="openAddModal()" class="btn-amber" style="font-size:0.85rem">+ Add Vehicle</button>
  </header>
  <div class="page-content">
    <div id="vehicles-grid" class="row g-3"></div>
  </div>
</div>

<!-- Add/Edit Vehicle Modal -->
<div class="modal fade modal-glass" id="vehicleModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="modal-title">Add Vehicle</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <input type="hidden" id="edit-vehicle-id"/>
      <div class="mb-3"><label class="form-label">Registration Number *</label><input type="text" id="v-reg" class="form-control-glass" placeholder="TN38AB1234" style="text-transform:uppercase"/></div>
      <div class="row g-2 mb-3">
        <div class="col-6"><label class="form-label">Vehicle Type *</label>
          <select id="v-type" class="form-select-glass"><option value="TWO_WHEELER">Two Wheeler</option><option value="FOUR_WHEELER">Four Wheeler</option></select></div>
        <div class="col-6"><label class="form-label">Fuel Type *</label>
          <select id="v-fuel" class="form-select-glass"><option value="PETROL">Petrol</option><option value="DIESEL">Diesel</option><option value="ELECTRIC">Electric</option><option value="CNG">CNG</option><option value="HYBRID">Hybrid</option></select></div>
      </div>
      <div class="row g-2 mb-3">
        <div class="col-6"><label class="form-label">Brand *</label><input type="text" id="v-brand" class="form-control-glass" placeholder="Honda"/></div>
        <div class="col-6"><label class="form-label">Model *</label><input type="text" id="v-model" class="form-control-glass" placeholder="Activa 6G"/></div>
      </div>
      <div class="row g-2">
        <div class="col-6"><label class="form-label">Year</label><input type="number" id="v-year" class="form-control-glass" placeholder="2022" min="1990" max="2030"/></div>
        <div class="col-6"><label class="form-label">Mileage (km)</label><input type="number" id="v-mileage" class="form-control-glass" placeholder="12000" min="0"/></div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn-glass" data-bs-dismiss="modal">Cancel</button>
      <button type="button" class="btn-amber" id="btn-save-vehicle">Save Vehicle</button>
    </div>
  </div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/firebase-init.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script>
GarageAuth.requireAuth(['CUSTOMER']);
const TYPE_ICON = { TWO_WHEELER: '🛵', FOUR_WHEELER: '🚗' };

garageAuth.onAuthStateChanged(async user => {
  if (!user) return;
  setupSidebarUser(); setupLogoutBtn();
  await loadVehicles();
});

async function loadVehicles() {
  try {
    const vehicles = await API.getVehicles();
    const grid = document.getElementById('vehicles-grid');
    if (vehicles.length === 0) {
      grid.innerHTML = `<div class="col-12"><div class="empty-state"><div class="empty-state-icon">🚗</div><div class="empty-state-title">No vehicles yet</div><div class="empty-state-text">Add your first vehicle to book services</div><button onclick="openAddModal()" class="btn-amber" style="margin-top:1rem">Add Vehicle</button></div></div>`;
      return;
    }
    grid.innerHTML = vehicles.map(v => `
      <div class="col-md-6 col-lg-4">
        <div class="stat-card" style="cursor:default">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem">
            <div style="font-size:2rem">${TYPE_ICON[v.vehicleType]||'🚗'}</div>
            <span style="font-size:0.7rem;color:var(--amber-400);background:var(--amber-glow);padding:0.2rem 0.6rem;border-radius:100px;font-weight:600">${v.fuelType||''}</span>
          </div>
          <div style="font-size:1.1rem;font-weight:800;color:var(--text-primary)">${v.brand||''} ${v.model||''}</div>
          <div style="font-size:1rem;color:var(--amber-400);font-weight:700;letter-spacing:0.05em;margin:0.25rem 0">${v.registrationNumber||''}</div>
          <div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:1rem">${v.manufacturingYear||''} · ${(v.mileage||0).toLocaleString()} km</div>
          <div style="display:flex;gap:0.5rem">
            <a href="/customer-book-service.html?vehicleId=${v.vehicleId}" class="btn-amber" style="font-size:0.78rem;padding:0.35rem 0.75rem">Book Service</a>
            <button onclick="openEditModal(${JSON.stringify(v).replace(/"/g,'&quot;')})" class="btn-glass" style="font-size:0.78rem;padding:0.35rem 0.75rem">Edit</button>
            <button onclick="deleteVehicle('${v.vehicleId}')" class="btn-glass" style="font-size:0.78rem;padding:0.35rem 0.75rem;color:var(--danger);border-color:rgba(239,68,68,0.3)">Delete</button>
          </div>
        </div>
      </div>`).join('');
  } catch (err) { Toast.error(err.message); }
}

function openAddModal() {
  document.getElementById('modal-title').textContent = 'Add Vehicle';
  document.getElementById('edit-vehicle-id').value = '';
  ['v-reg','v-brand','v-model'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('v-year').value = new Date().getFullYear();
  document.getElementById('v-mileage').value = '0';
  document.getElementById('v-reg').disabled = false;
  new bootstrap.Modal(document.getElementById('vehicleModal')).show();
}

function openEditModal(v) {
  document.getElementById('modal-title').textContent = 'Edit Vehicle';
  document.getElementById('edit-vehicle-id').value = v.vehicleId;
  document.getElementById('v-reg').value = v.registrationNumber; document.getElementById('v-reg').disabled = true;
  document.getElementById('v-type').value = v.vehicleType;
  document.getElementById('v-fuel').value = v.fuelType;
  document.getElementById('v-brand').value = v.brand;
  document.getElementById('v-model').value = v.model;
  document.getElementById('v-year').value = v.manufacturingYear;
  document.getElementById('v-mileage').value = v.mileage;
  new bootstrap.Modal(document.getElementById('vehicleModal')).show();
}

document.getElementById('btn-save-vehicle').onclick = async () => {
  const editId = document.getElementById('edit-vehicle-id').value;
  Loader.show();
  try {
    if (editId) {
      await API.updateVehicle(editId, { brand: document.getElementById('v-brand').value, model: document.getElementById('v-model').value, mileage: parseInt(document.getElementById('v-mileage').value)||0 });
      Toast.success('Vehicle updated!');
    } else {
      await API.addVehicle({ registrationNumber: document.getElementById('v-reg').value.toUpperCase(), vehicleType: document.getElementById('v-type').value, brand: document.getElementById('v-brand').value, model: document.getElementById('v-model').value, fuelType: document.getElementById('v-fuel').value, manufacturingYear: parseInt(document.getElementById('v-year').value)||2020, mileage: parseInt(document.getElementById('v-mileage').value)||0 });
      Toast.success('Vehicle added!');
    }
    bootstrap.Modal.getInstance(document.getElementById('vehicleModal'))?.hide();
    await loadVehicles();
  } catch (err) { Toast.error(err.message); }
  finally { Loader.hide(); }
};

async function deleteVehicle(id) {
  if (!confirm('Delete this vehicle? This cannot be undone.')) return;
  Loader.show();
  try { await API.deleteVehicle(id); Toast.success('Vehicle deleted.'); await loadVehicles(); }
  catch (err) { Toast.error(err.message); }
  finally { Loader.hide(); }
}
</script>
</body>
</html>
