<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — NEKA Garage Management</title>
  <meta name="description" content="Login to NEKA Smart Garage Service Booking System"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-primary); }
    .auth-container { width: 100%; max-width: 440px; padding: 1rem; }
    .auth-logo { text-align: center; margin-bottom: 2rem; }
    .auth-logo-icon { width: 64px; height: 64px; background: linear-gradient(135deg,#f59e0b,#d97706); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 900; color: #000; margin: 0 auto 1rem; letter-spacing: -2px; }
    .auth-card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 2.5rem; }
    .auth-title { font-size: 1.5rem; font-weight: 800; text-align: center; margin-bottom: 0.25rem; }
    .auth-subtitle { color: var(--text-muted); font-size: 0.875rem; text-align: center; margin-bottom: 2rem; }
    .bg-pattern { position: fixed; inset: 0; background: radial-gradient(ellipse at 20% 50%, rgba(245,158,11,0.06) 0%, transparent 50%), radial-gradient(ellipse at 80% 10%, rgba(168,85,247,0.04) 0%, transparent 40%); pointer-events: none; }
    .divider { display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0; }
    .divider span { flex: 1; height: 1px; background: var(--border-color); }
    .divider em { color: var(--text-muted); font-size: 0.75rem; font-style: normal; }
    .error-msg { background: var(--danger-bg); border: 1px solid rgba(239,68,68,0.2); border-radius: var(--radius-sm); padding: 0.75rem 1rem; font-size: 0.85rem; color: var(--danger); display: none; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>
  <div class="auth-container">
    <div class="auth-logo">
      <div class="auth-logo-icon">NG</div>
      <div style="font-size:1.1rem;font-weight:700;color:var(--text-primary)">NEKA Garage</div>
      <div style="font-size:0.75rem;color:var(--text-muted)">Smart Service Management</div>
    </div>

    <div class="auth-card">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your account</p>

      <div id="error-msg" class="error-msg"></div>

      <form id="login-form">
        <div class="mb-3">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control-glass" placeholder="you@example.com" required/>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control-glass" placeholder="••••••••" required/>
        </div>
        <button type="submit" id="btn-login" class="btn-amber w-100 mt-1" style="padding:0.8rem">
          Sign In
        </button>
      </form>

      <div class="divider"><span></span><em>or</em><span></span></div>

      <a href="/register.html" class="btn-glass w-100" style="padding:0.75rem;display:block;text-align:center">
        Create new account
      </a>

      <p style="text-align:center;font-size:0.75rem;color:var(--text-muted);margin-top:1.5rem">
        Customer? <a href="/register.html">Register here</a> ·
        Staff/Admin accounts are created by the administrator.
      </p>
    </div>
  </div>

  <!-- Firebase SDKs (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="/js/firebase-init.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Already logged in? Redirect
    garageAuth.onAuthStateChanged(async user => {
      if (user) {
        const profile = GarageAuth.getStoredUser();
        if (profile) { GarageAuth.redirectByRole(profile.role); return; }
        const token = await user.getIdToken();
        const resp = await fetch('/api/auth/profile', { headers: { Authorization: `Bearer ${token}` } });
        if (resp.ok) {
          const p = await resp.json();
          localStorage.setItem('garage_user', JSON.stringify(p));
          GarageAuth.redirectByRole(p.role);
        }
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const errEl = document.getElementById('error-msg');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const { profile } = await GarageAuth.login(
          document.getElementById('email').value,
          document.getElementById('password').value
        );
        GarageAuth.redirectByRole(profile.role);
      } catch (err) {
        errEl.textContent = err.message.replace('Firebase: ', '').replace(/\(auth\/.*?\)/, '').trim();
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
