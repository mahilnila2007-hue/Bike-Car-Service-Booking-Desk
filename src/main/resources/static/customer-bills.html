<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bills & Payments — NEKA Garage</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo"><div class="sidebar-logo-icon">NG</div><div><div class="sidebar-logo-text">NEKA Garage</div><div class="sidebar-logo-sub">Customer Portal</div></div></div>
  <nav class="sidebar-nav">
    <a href="/customer-dashboard.html" class="nav-item"><span class="nav-icon">🏠</span> Dashboard</a>
    <a href="/customer-vehicles.html" class="nav-item"><span class="nav-icon">🚗</span> My Vehicles</a>
    <a href="/customer-book-service.html" class="nav-item"><span class="nav-icon">📅</span> Book Service</a>
    <a href="/customer-service-tracking.html" class="nav-item"><span class="nav-icon">📍</span> Live Tracking</a>
    <a href="/customer-history.html" class="nav-item"><span class="nav-icon">📋</span> Service History</a>
    <a href="/customer-bills.html" class="nav-item active"><span class="nav-icon">🧾</span> Bills & Payments</a>
  </nav>
  <div class="sidebar-footer">
    <div class="user-chip">
      <div class="user-avatar" id="sidebar-user-avatar">?</div>
      <div><div class="user-info-name" id="sidebar-user-name">Loading…</div><div class="user-info-role" id="sidebar-user-role">Customer</div></div>
      <button id="btn-logout" style="margin-left:auto;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1.1rem">⏻</button>
    </div>
  </div>
</aside>

<div class="main-content">
  <header class="topbar">
    <div><div class="topbar-title">🧾 Bills & Payments</div><div class="topbar-subtitle">Your billing history</div></div>
  </header>
  <div class="page-content">
    <div class="content-card">
      <div id="bills-container">
        <div class="empty-state"><div class="empty-state-icon">🧾</div><div class="empty-state-title">No bills yet</div><div class="empty-state-text">Bills are generated after your service is completed.</div></div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="/js/firebase-init.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script>
GarageAuth.requireAuth(['CUSTOMER']);
garageAuth.onAuthStateChanged(async user => {
  if (!user) return;
  setupSidebarUser(); setupLogoutBtn();
  try {
    const bills = await API.getBills();
    if (bills.length === 0) return;
    bills.sort((a,b) => new Date(b.generatedAt||0) - new Date(a.generatedAt||0));
    document.getElementById('bills-container').innerHTML = `
      <table class="table-glass w-100">
        <thead><tr><th>Bill</th><th>Labour</th><th>Parts</th><th>Tax</th><th>Total</th><th>Status</th><th>Date</th></tr></thead>
        <tbody>
          ${bills.map(b => `<tr>
            <td style="font-weight:700;font-size:0.8rem;color:var(--amber-400)">${b.billId?.slice(-8)?.toUpperCase()}</td>
            <td>${formatCurrency(b.labourCost)}</td>
            <td>${formatCurrency(b.partsCost)}</td>
            <td style="color:var(--text-muted)">${formatCurrency(b.taxAmount)}</td>
            <td style="font-weight:700;color:var(--text-primary)">${formatCurrency(b.totalAmount)}</td>
            <td>${getStatusBadge(b.paymentStatus)}</td>
            <td style="font-size:0.8rem;color:var(--text-muted)">${formatDate(b.generatedAt)}</td>
          </tr>`).join('')}
        </tbody>
      </table>`;
  } catch (err) { Toast.error(err.message); }
});
</script>
</body>
</html>
