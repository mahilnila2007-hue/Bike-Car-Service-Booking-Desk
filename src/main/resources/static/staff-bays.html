<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Manage service bays at NEKA Garage — view availability, update status, and create new bays."/>
  <title>Bay Management — NEKA Garage</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo"><div class="sidebar-logo-icon">NG</div><div><div class="sidebar-logo-text">NEKA Garage</div><div class="sidebar-logo-sub">Staff Portal</div></div></div>
  <nav class="sidebar-nav">
    <a href="/staff-dashboard.html" class="nav-item"><span class="nav-icon">🏠</span> Dashboard</a>
    <a href="/staff-bookings.html" class="nav-item"><span class="nav-icon">📅</span> Bookings</a>
    <a href="/staff-service-board.html" class="nav-item"><span class="nav-icon">⚙️</span> Service Board</a>
    <a href="/staff-bays.html" class="nav-item active"><span class="nav-icon">🏢</span> Bays</a>
    <a href="/staff-mechanics.html" class="nav-item"><span class="nav-icon">👨‍🔧</span> Mechanics</a>
    <a href="/staff-customers.html" class="nav-item"><span class="nav-icon">👥</span> Customers</a>
    <a href="/staff-billing.html" class="nav-item"><span class="nav-icon">🧾</span> Billing</a>
  </nav>
  <div class="sidebar-footer">
    <div class="user-chip">
      <div class="user-avatar" id="sidebar-user-avatar">?</div>
      <div><div class="user-info-name" id="sidebar-user-name">Loading…</div><div class="user-info-role" id="sidebar-user-role">Staff</div></div>
      <button id="btn-logout" style="margin-left:auto;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1.1rem">⏻</button>
    </div>
  </div>
</aside>

<div class="main-content">
  <header class="topbar">
    <div><div class="topbar-title">🏢 Bay Management</div><div class="topbar-subtitle">Monitor and control service bays</div></div>
    <div style="display:flex;gap:0.5rem">
      <button onclick="loadBays()" class="btn-glass" style="font-size:0.8rem">↻ Refresh</button>
      <button onclick="openCreateModal()" id="btn-create-bay" class="btn-amber" style="font-size:0.8rem;display:none">+ Add Bay</button>
    </div>
  </header>
  <div class="page-content">

    <!-- Summary Stats -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-icon" style="background:var(--success-bg);color:var(--success)">🟢</div>
          <div class="stat-value" id="stat-available">—</div>
          <div class="stat-label">Available</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-icon" style="background:var(--danger-bg);color:var(--danger)">🔴</div>
          <div class="stat-value" id="stat-occupied">—</div>
          <div class="stat-label">Occupied</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-icon" style="background:var(--warning-bg);color:var(--warning)">🔧</div>
          <div class="stat-value" id="stat-maintenance">—</div>
          <div class="stat-label">Maintenance</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-icon" style="background:var(--amber-glow);color:var(--amber-400)">📊</div>
          <div class="stat-value" id="stat-utilization">—</div>
          <div class="stat-label">Utilization</div>
        </div>
      </div>
    </div>

    <!-- Bay Grid -->
    <div class="content-card">
      <div class="content-card-header">
        <span class="section-title">All Service Bays</span>
        <select id="filter-status" class="form-select-glass" style="max-width:180px" onchange="renderBays()">
          <option value="">All Bays</option>
          <option value="AVAILABLE">Available</option>
          <option value="OCCUPIED">Occupied</option>
          <option value="MAINTENANCE">Maintenance</option>
        </select>
      </div>
      <div id="bays-grid" class="row g-3">
        <div class="empty-state"><div class="empty-state-icon">🏢</div><div class="empty-state-title">Loading bays…</div></div>
      </div>
    </div>

  </div>
</div>

<!-- Create Bay Modal -->
<div class="modal fade modal-glass" id="createBayModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Add New Bay</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div class="mb-3"><label class="form-label">Bay Number / Name</label><input type="text" id="new-bay-number" class="form-control-glass" placeholder="e.g. Bay-A1"/></div>
      <div class="mb-3"><label class="form-label">Bay Type</label>
        <select id="new-bay-type" class="form-select-glass">
          <option value="GENERAL">General</option>
          <option value="HEAVY">Heavy Vehicle</option>
          <option value="QUICK_SERVICE">Quick Service</option>
          <option value="BODY_SHOP">Body Shop</option>
        </select>
      </div>
      <div class="mb-3"><label class="form-label">Description (optional)</label><input type="text" id="new-bay-desc" class="form-control-glass" placeholder="Any notes about this bay"/></div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn-glass" data-bs-dismiss="modal">Cancel</button>
      <button type="button" class="btn-amber" id="btn-save-bay">Create Bay</button>
    </div>
  </div></div>
</div>

<!-- Status Update Modal -->
<div class="modal fade modal-glass" id="statusModal" tabindex="-1">
  <div class="modal-dialog modal-sm"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Update Bay Status</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <p style="color:var(--text-muted);font-size:0.9rem" id="modal-bay-label"></p>
      <div class="mb-3"><label class="form-label">New Status</label>
        <select id="modal-new-status" class="form-select-glass">
          <option value="AVAILABLE">🟢 Available</option>
          <option value="OCCUPIED">🔴 Occupied</option>
          <option value="MAINTENANCE">🔧 Maintenance</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn-glass" data-bs-dismiss="modal">Cancel</button>
      <button type="button" class="btn-amber" id="btn-confirm-status">Update</button>
    </div>
  </div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/firebase-init.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script>
GarageAuth.requireAuth(['STAFF', 'ADMIN']);

let allBays = [];
let selectedBayId = null;
let isAdmin = false;

garageAuth.onAuthStateChanged(async user => {
  if (!user) return;
  setupSidebarUser(); setupLogoutBtn();
  const profile = GarageAuth.getStoredUser();
  if (profile && profile.role === 'ADMIN') {
    isAdmin = true;
    document.getElementById('btn-create-bay').style.display = 'inline-flex';
    document.getElementById('btn-create-bay').style.display = 'block';
  }
  await loadBays();
});

async function loadBays() {
  Loader.show();
  try {
    allBays = await API.getBays();
    renderBays();
    updateStats();
  } catch (err) { Toast.error(err.message); }
  finally { Loader.hide(); }
}

function updateStats() {
  const avail = allBays.filter(b => b.status === 'AVAILABLE').length;
  const occ   = allBays.filter(b => b.status === 'OCCUPIED').length;
  const maint = allBays.filter(b => b.status === 'MAINTENANCE').length;
  const total = allBays.length;
  document.getElementById('stat-available').textContent = avail;
  document.getElementById('stat-occupied').textContent = occ;
  document.getElementById('stat-maintenance').textContent = maint;
  document.getElementById('stat-utilization').textContent = total > 0 ? Math.round((occ/total)*100) + '%' : '0%';
}

function renderBays() {
  const filter = document.getElementById('filter-status').value;
  const filtered = filter ? allBays.filter(b => b.status === filter) : allBays;

  if (filtered.length === 0) {
    document.getElementById('bays-grid').innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><div class="empty-state-title">No bays found</div></div>';
    return;
  }

  document.getElementById('bays-grid').innerHTML = filtered.map(bay => {
    const statusColors = {
      'AVAILABLE':   { bg: 'var(--success-bg)',    border: 'rgba(34,197,94,0.3)',  dot: '#22c55e' },
      'OCCUPIED':    { bg: 'var(--danger-bg)',      border: 'rgba(239,68,68,0.3)',  dot: '#ef4444' },
      'MAINTENANCE': { bg: 'var(--warning-bg)',     border: 'rgba(234,179,8,0.3)',  dot: '#eab308' },
    };
    const sc = statusColors[bay.status] || statusColors['AVAILABLE'];
    return `
      <div class="col-sm-6 col-md-4 col-lg-3">
        <div style="background:var(--bg-card);border:1px solid ${sc.border};border-radius:var(--radius);padding:1.25rem;transition:var(--transition);position:relative;overflow:hidden">
          <div style="position:absolute;top:0;left:0;right:0;height:3px;background:${sc.dot}"></div>
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.75rem">
            <div>
              <div style="font-size:1.8rem;line-height:1">🏢</div>
              <div style="font-size:1.1rem;font-weight:800;color:var(--text-primary);margin-top:0.4rem">${bay.bayNumber || 'Bay'}</div>
            </div>
            ${getStatusBadge(bay.status)}
          </div>
          <div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:0.25rem">Type: <span style="color:var(--text-secondary)">${bay.bayType || 'General'}</span></div>
          ${bay.description ? `<div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:0.75rem">${bay.description}</div>` : '<div style="margin-bottom:0.75rem"></div>'}
          <div style="display:flex;gap:0.5rem">
            <button onclick="openStatusModal('${bay.bayId}', '${bay.bayNumber}', '${bay.status}')"
              class="btn-glass w-100" style="font-size:0.78rem;padding:0.35rem 0.5rem">
              Change Status
            </button>
          </div>
        </div>
      </div>`;
  }).join('');
}

function openStatusModal(bayId, bayNumber, currentStatus) {
  selectedBayId = bayId;
  document.getElementById('modal-bay-label').textContent = `Bay: ${bayNumber}`;
  document.getElementById('modal-new-status').value = currentStatus;
  new bootstrap.Modal(document.getElementById('statusModal')).show();
}

document.getElementById('btn-confirm-status').onclick = async () => {
  const newStatus = document.getElementById('modal-new-status').value;
  Loader.show();
  try {
    await API.updateBayStatus(selectedBayId, newStatus);
    Toast.success('Bay status updated!');
    bootstrap.Modal.getInstance(document.getElementById('statusModal'))?.hide();
    await loadBays();
  } catch (err) { Toast.error(err.message); }
  finally { Loader.hide(); }
};

function openCreateModal() {
  document.getElementById('new-bay-number').value = '';
  document.getElementById('new-bay-type').value = 'GENERAL';
  document.getElementById('new-bay-desc').value = '';
  new bootstrap.Modal(document.getElementById('createBayModal')).show();
}

document.getElementById('btn-save-bay').onclick = async () => {
  const bayNumber = document.getElementById('new-bay-number').value.trim();
  if (!bayNumber) { Toast.warning('Enter a bay number.'); return; }
  const bayType = document.getElementById('new-bay-type').value;
  const description = document.getElementById('new-bay-desc').value.trim();
  Loader.show();
  try {
    await API.post('/api/bays', { bayNumber, bayType, description, status: 'AVAILABLE' });
    Toast.success(`Bay "${bayNumber}" created!`);
    bootstrap.Modal.getInstance(document.getElementById('createBayModal'))?.hide();
    await loadBays();
  } catch (err) { Toast.error(err.message); }
  finally { Loader.hide(); }
};
</script>
</body>
</html>
